# One grouped PR per ecosystem per month instead of one PR per package.
# Major versions are ignored for npm and Cargo: they need a deliberate upgrade
# and manual testing, not an automatic bump.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Must move in lockstep with the tauri crates in src-tauri/Cargo.toml.
      - dependency-name: "@tauri-apps/*"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Tauri crates must be upgraded together with @tauri-apps/* in package.json.
      - dependency-name: "tauri*"
      # Windows-only dependencies; this repository does not build or test Windows.
      - dependency-name: "webview2-com"
      - dependency-name: "windows"
      - dependency-name: "winreg"
      - dependency-name: "tauri-winrt-notification"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    # Grouped so paired actions (CodeQL init/analyze) always move together.
    groups:
      actions:
        patterns: ["*"]
